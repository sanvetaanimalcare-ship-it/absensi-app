<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Admin — Absensi</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="card">
    <div class="topbar">
      <span class="name" id="who">...</span>
      <button class="btn small ghost" onclick="logout()">Keluar</button>
    </div>

    <h2>📋 Daftar Absensi</h2>
    <div class="filters">
      <input type="date" id="from">
      <input type="date" id="to">
      <button class="btn small primary" onclick="loadRecords()">Tampilkan</button>
    </div>
    <div id="records"><p class="empty">Memuat...</p></div>
  </div>

  <div class="card">
    <h2>👥 Karyawan</h2>
    <div id="emps"><p class="empty">Memuat...</p></div>
    <details style="margin-top:12px">
      <summary class="muted" style="cursor:pointer">+ Tambah karyawan</summary>
      <form id="fEmp" style="margin-top:10px">
        <input id="nName" placeholder="Nama lengkap" required>
        <input id="nUser" placeholder="Username" required>
        <input id="nPass" type="password" placeholder="Password (min 6)" required>
        <button class="btn primary">Tambah</button>
      </form>
    </details>
  </div>

<script>
const $ = id => document.getElementById(id);
function logout() { fetch('/api/logout', { method: 'POST' }).then(() => location.href = '/'); }
const fmt = ts => new Date(ts).toLocaleString('id-ID', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });

async function init() {
  const r = await fetch('/api/me');
  if (r.status === 401) return location.href = '/';
  const me = await r.json();
  if (!me.isAdmin) return location.href = '/absen';
  $('who').textContent = '🛡️ Admin';
  const t = new Date();
  $('from').value = t.toISOString().slice(0, 10);
  $('to').value = t.toISOString().slice(0, 10);
  loadRecords(); loadEmps();
}

async function loadRecords() {
  const q = new URLSearchParams();
  if (from.value) q.set('from', from.value);
  if (to.value) q.set('to', to.value);
  const rows = await (await fetch('/api/records?' + q)).json();
  if (!rows.length) { $('records').innerHTML = '<p class="empty">Tidak ada data pada rentang ini</p>'; return; }
  // kelompokkan per hari
  const byDay = {};
  rows.forEach(r => { const d = new Date(r.ts).toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }); (byDay[d] = byDay[d] || []).push(r); });
  $('records').innerHTML = Object.entries(byDay).map(([d, list]) => `
    <p class="muted" style="margin:12px 0 4px;font-weight:700">${d}</p>
    ${list.map(r => `
      <div class="rec">
        <img src="${r.photo}" alt="selfie" loading="lazy">
        <div class="info">
          <div class="rname">${r.name}</div>
          <div class="rtime">${fmt(r.ts)} · akurasi ±${r.acc ?? '?'}m</div>
          <a class="maplink" target="_blank" rel="noopener" href="https://maps.google.com/?q=${r.lat},${r.lng}">📍 Lihat lokasi di peta</a>
        </div>
        <span class="badge ${r.type}">${r.type === 'in' ? 'MASUK' : 'PULANG'}</span>
      </div>`).join('')}`).join('');
}

async function loadEmps() {
  const list = await (await fetch('/api/employees')).json();
  $('emps').innerHTML = list.map(e => `
    <div class="emp-row">
      <div class="info">
        <div>${e.name} ${e.isAdmin ? '<span class="badge in">ADMIN</span>' : ''}</div>
        <div class="uname">@${e.username}</div>
      </div>
      ${e.isAdmin ? '' : `
        <button class="btn small ghost" onclick="resetPw(${e.id}, '${e.name}')">Reset PW</button>
        <button class="btn small danger" onclick="delEmp(${e.id}, '${e.name}')">Hapus</button>`}
    </div>`).join('');
}

$('fEmp').addEventListener('submit', async e => {
  e.preventDefault();
  const r = await fetch('/api/employees', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name: nName.value, username: nUser.value, password: nPass.value })
  });
  const d = await r.json();
  alert(r.ok ? 'Karyawan ditambahkan ✓' : (d.error || 'Gagal'));
  if (r.ok) { fEmp.reset(); loadEmps(); }
});

async function delEmp(id, name) {
  if (!confirm(`Hapus ${name} beserta seluruh riwayat absensinya?`)) return;
  const r = await fetch('/api/employees/' + id, { method: 'DELETE' });
  if (r.ok) loadEmps(); else alert((await r.json()).error);
}
async function resetPw(id, name) {
  const pw = prompt(`Password baru untuk ${name}: (min 6 karakter)`);
  if (!pw) return;
  const r = await fetch(`/api/employees/${id}/password`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ password: pw })
  });
  alert(r.ok ? 'Password direset ✓' : (await r.json()).error);
}

init();
</script>
</body>
</html>
